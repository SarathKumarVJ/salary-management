version: 2
updates:
- package-ecosystem: bundler
  directory: "/backend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  ignore:
  # Types must match the Node runtime (.nvmrc: 24); bump together with Node.
  - dependency-name: "@types/node"
    update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
